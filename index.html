<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتولي إليكتريك | الأجهزة الكهربائية المنزلية</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="container header-content">
    <div class="logo">
      <span>المتولي</span>
      <small>إليكتريك</small>
    </div>

    <button class="cart-btn" onclick="toggleCart()">
      🛒 السلة <span id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>المتولي إليكتريك</h1>
    <p>أجهزة كهربائية منزلية بجودة وأسعار مناسبة</p>
    <a href="#products" class="hero-btn">تصفح المنتجات</a>
  </div>
</section>

<section class="categories">
  <div class="container">
    <h2>الأقسام</h2>

    <div class="category-list">
      <button onclick="filterProducts('all')">الكل</button>
      <button onclick="filterProducts('kitchen')">أجهزة المطبخ</button>
      <button onclick="filterProducts('iron')">مكاوي</button>
      <button onclick="filterProducts('microwave')">ميكروويف وأفران</button>
      <button onclick="filterProducts('other')">أجهزة منزلية</button>
    </div>
  </div>
</section>

<section class="products-section" id="products">
  <div class="container">

    <div class="section-title">
      <h2>منتجاتنا</h2>

      <input
        type="text"
        id="searchInput"
        placeholder="🔎 ابحث عن منتج..."
        oninput="searchProducts()"
      >
    </div>

    <div id="productsGrid" class="products-grid"></div>

  </div>
</section>

<div id="cartOverlay" class="cart-overlay" onclick="toggleCart()"></div>
